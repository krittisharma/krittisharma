- title: "Caltech Astronomy Outreach Volunteer"
  org: "Caltech"
  year: "2025"
  what: "Q&A panelist for a public star-gazing lecture."
  audience: "General public"
  role: >
    Engaged with the community and communicated astronomy research in an
    accessible way, contributing to public science outreach through
    interactive discussions and Q&A on radio astronomy, the DSA-2000
    survey, and the science of the night sky.

- title: "Lecturer, FTSky Workshop"
  org: "International Center for Theoretical Sciences (ICTS), TIFR"
  year: "2025"
  what: "A program in the field of Fast Radio Transients — an intensive, hands-on training workshop."
  audience: "100+ students"
  role: >
    Led an intensive hands-on training session on optical studies of FRB
    host galaxies, covering archival data mining, data reduction, galaxy
    morphology, and SED analysis. Designed and delivered lectures and
    tutorials on probabilistic host-galaxy association, optical
    spectroscopy, and SED modeling, guiding participants through real
    astronomical analysis workflows.

- title: "Teaching Assistant, Graduate-Level Courses"
  org: "Caltech and IIT Bombay"
  year: "2021 – 2024"
  what: >
    Ay124: Structure and Evolution of Galaxies (Prof. Phil Hopkins,
    Caltech, Winter 2024); Ay121: Radiative Processes (Prof. Sterl
    Phinney, Caltech, Fall 2023); PH556: Astrophysics (Prof. Varun
    Bhalerao, IIT Bombay, Spring 2021).
  audience: "Graduate students"
  role: >
    Conducted tutorials, graded assignments, mentored students, and
