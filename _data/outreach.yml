- title: "Amateur Astronomy Club Manager, Krittika"
  org: "The Astronomy Club of IIT Bombay"
  year: "2019 – 2021"
  what: "Institute-wide astronomy programming, projects, and night-sky observation sessions."
  audience: "~100 members at IITB, ~5,500 online enthusiasts"
  role: >
    Managed 10 conveners tending to the club's community. Supervised 6
    projects, 2 week-long tutorials on numerical computing, and 3-day
    workshops. Ideated Team ANYmations to generate scriptable scientific
    animations for publicity campaigns. Organized institute-wide lectures,
    discussions, documentary screenings, and competitions such as
    Astromania and the Scientific Computation/Observation Planning
    Championships. Conducted night-sky observation sessions and
    familiarized beginners with telescope handling and observation
    planning.
