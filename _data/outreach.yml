- title: "Maunakea Astroday Public Outreach Program Volunteer"
  org: "Astronomer Community Engagement (ACE) Program, Caltech Optical Observatories"
  year: "2024"
  what: "A public outreach event introducing multi-wavelength astronomy to schoolchildren."
  audience: "Elementary school students"
  role: >
    Introduced elementary school students to the fundamentals of UV, IR,
    and optical astronomy, and demonstrated how infrared observations
    probe the dust-obscured content of star-forming galaxies.

