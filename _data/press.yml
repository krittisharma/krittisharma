- outlet: "Forbes"
  date: "August 2020"
  title: "Our Planet Protected Us. Earth 'Bends' An Asteroid Just 1,830 Miles Out, The Closest Flyby On Record"
  url: "https://www.forbes.com/sites/jamiecartereurope/2020/08/19/our-planet-protected-us-earth-bends-an-asteroid-just-1830-miles-out-the-closest-flyby-on-record/"
