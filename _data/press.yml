- outlet: "AAS Nova"
  date: "August 2026"
  title: "Diving into the Darkest Corners of the Universe with Fast Radio Bursts"
  url: "https://aasnova.org/2026/08/05/diving-into-the-darkest-corners-of-the-universe-with-fast-radio-bursts/"
  summary: >
    An AAS research highlight of our work on using FRB dispersion measures to trace the Universe's faintest, most diffuse gas in cosmic voids.

- outlet: "Caltech"
  date: "June 2025"
  title: "Missing Matter in Universe Found"
  url: "https://www.caltech.edu/about/news/missing-matter-in-universe-found"
  summary: >
    Reports on our Nature Astronomy study using FRBs to locate roughly three-quarters of the Universe’s long-sought “missing” ordinary matter in the diffuse gas between galaxies.

- outlet: "Harvard University / Center for Astrophysics"
  date: "June 2025"
  title: "A New GPS for the Intergalactic Medium: Astronomers Have Found the Home Address for Universe's 'Missing' Matter"
  url: "https://www.cfa.harvard.edu/news/new-gps-intergalactic-medium-astronomers-have-found-home-address-universes-missing-matter"
  summary: >
    Harvard's release on the same result, framed around the decades-old "missing baryon problem".

- outlet: "Caltech"
  interviewed: false
  date: "November 2024"
  title: "Mighty Radio Bursts Linked to Massive Galaxies"
  url: "https://www.caltech.edu/about/news/mighty-radio-bursts-linked-to-massive-galaxies"
  summary: >
    Covers our Nature paper showing FRBs preferentially occur in massive, star-forming galaxies - evidence that the magnetars thought to power FRBs may form through the merger of two stars rather than a single massive star's collapse.

- outlet: "Nature — News & Views"
  interviewed: false
  date: "November 2024"
  title: "Mysterious radio bursts mostly come from massive galaxies"
  url: "https://www.nature.com/articles/d41586-024-03465-4"
  summary: >
    A News & Views commentary on the same result, explaining why the galactic environments of FRBs are a clue to the origin of magnetars - the extreme, highly magnetized neutron stars thought to produce them.

- outlet: "IIT Bombay"
  interviewed: false
