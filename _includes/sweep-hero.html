<div class="hero-sweep-wrap" aria-hidden="true">
<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c7cf0"/>
      <stop offset="50%" stop-color="#6fa3ef"/>
      <stop offset="100%" stop-color="#3fe1d0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- faint frequency-channel grid -->
  <g stroke="rgba(232,234,240,0.07)" stroke-width="1">
    <line x1="40" y1="50"  x2="760" y2="50"/>
    <line x1="40" y1="90"  x2="760" y2="90"/>
    <line x1="40" y1="130" x2="760" y2="130"/>
    <line x1="40" y1="170" x2="760" y2="170"/>
    <line x1="40" y1="210" x2="760" y2="210"/>
    <line x1="40" y1="250" x2="760" y2="250"/>
  </g>

  <text x="40" y="34" fill="#5c6377" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5">HIGH ν — ARRIVES FIRST</text>
  <text x="600" y="278" fill="#5c6377" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5">LOW ν — DELAYED BY BARYONS</text>

  <!-- the swept pulse: Δt ∝ DM · ν⁻² -->
  <path d="M60,52 C 210,58 330,78 430,118 C 560,168 630,225 720,252"
        fill="none" stroke="url(#sweepGrad)" stroke-width="3.2"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- sampled "detections" along the sweep -->
  <g fill="#e8eaf0">
    <circle cx="60"  cy="52"  r="3.4"/>
    <circle cx="160" cy="55"  r="3"/>
    <circle cx="260" cy="64"  r="3"/>
    <circle cx="350" cy="86"  r="3"/>
    <circle cx="430" cy="118" r="3.2"/>
    <circle cx="510" cy="158" r="3"/>
    <circle cx="590" cy="198" r="3"/>
    <circle cx="660" cy="228" r="3"/>
    <circle cx="720" cy="252" r="3.4"/>
  </g>
</svg>
</div>
